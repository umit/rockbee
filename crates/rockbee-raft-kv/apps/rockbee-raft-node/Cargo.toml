[package]
name = "rockbee-raft-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Storage node for the independent Rockbee Raft KV workspace"

[features]
# Opt-in investigation only; ordinary builds have no recorder or observer tasks.
diagnostics = [
  "rockbee-raft-protocol/diagnostics",
  "rockbee-raft-gateway/diagnostics",
]

[dependencies]
log.workspace = true
env_logger.workspace = true
rockbee-raft-protocol.workspace = true
bytes.workspace = true
serde.workspace = true
toml.workspace = true
postcard.workspace = true
thiserror.workspace = true
tokio.workspace = true
openraft.workspace = true
rocksdb.workspace = true

[dev-dependencies]
tempfile.workspace = true
rockbee-raft-client = { path = "../../crates/rockbee-raft-client" }
rockbee-raft-gateway = { path = "../rockbee-raft-gateway" }
hdrhistogram = { version = "=7.6.0", default-features = false }

[lints]
workspace = true
