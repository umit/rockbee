[workspace]
members = [
  "crates/rockbee-raft-protocol",
  "crates/rockbee-raft-client",
  "apps/rockbee-raft-gateway",
  "apps/rockbee-raft-node",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
rockbee-raft-protocol = { path = "crates/rockbee-raft-protocol" }
bytes = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "=1.1.5", default-features = false, features = ["std", "serde", "parse"] }
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
thiserror = "2"
fnv = { version = "=1.0.7", default-features = false }
log = "0.4"
env_logger = { version = "=0.11.11", default-features = false, features = ["humantime"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
rocksdb = "=0.25.0"
tempfile = "3"

[workspace.lints.rust]
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
