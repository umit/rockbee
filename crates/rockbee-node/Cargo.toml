[package]
name = "rockbee-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SlateDB-backed Rockbee writer and reader runtime"

[lints]
workspace = true

[dependencies]
slatedb = { version = "=0.17.0", features = ["aws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
toml = "0.8.23"
rockbee-protocol = { path = "../rockbee-protocol" }
rockbee-rpc = { path = "../rockbee-rpc" }

[dev-dependencies]
tempfile = { version = "3", default-features = false }
rockbee-client = { path = "../rockbee-client" }
