[package]
name = "rockbee-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rockbee read-only storage node"

[lints]
workspace = true

[dependencies]
rockbee-runtime = { path = "../../crates/rockbee-runtime" }
rockbee-protocol = { path = "../../crates/rockbee-protocol" }
rockbee-query = { path = "../../crates/rockbee-query" }
slatedb = { version = "=0.17.0", features = ["aws"] }
tokio = { workspace = true }

[dev-dependencies]
rockbee-test-support = { path = "../../crates/rockbee-test-support" }
rockbee-client = { path = "../../crates/rockbee-client" }
serde_json = "1"
tempfile = { version = "3", default-features = false }
