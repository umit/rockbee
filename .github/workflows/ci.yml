name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/assets/**"

permissions:
  contents: read

concurrency:
  group: rockbee-ci
  cancel-in-progress: false

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-24.04-arm
    # A cold DuckDB build and the initial cache upload can exceed 30 minutes.
    timeout-minutes: 60
    env:
      # Preserve the previous CI setting and avoid caching incremental artifacts.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake perl pkg-config
      - name: Install Rust
        # rustup installs the toolchain and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Restore Cargo downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiled dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: build-v1-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'apps/*/Cargo.toml', 'tools/*/Cargo.toml', '.cargo/config.toml', 'Makefile', '.github/workflows/ci.yml', '.github/workflows/cache.yml') }}
          restore-keys: |
            build-v1-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Format, lint, and Rust tests
        run: make verify
