name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/assets/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: rockbee-ci
  cancel-in-progress: false

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-24.04-arm
    # A cold DuckDB build and the initial cache upload can exceed 30 minutes.
    timeout-minutes: 60
    env:
      # Preserve the previous CI setting and avoid caching incremental artifacts.
      CARGO_INCREMENTAL: "0"
      # GNU ld exhausted ARM runner memory when linking DuckDB test binaries in parallel.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine required checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_tests=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" -- . ':!.herdr' ':!.herdr/**' > "$RUNNER_TEMP/rockbee-ci-files"
            run_tests=false
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md|site/*|.github/assets/*) ;;
                *) run_tests=true; break ;;
              esac
            done < "$RUNNER_TEMP/rockbee-ci-files"
          fi
          echo "run_tests=$run_tests" >> "$GITHUB_OUTPUT"
      - name: Documentation and website changes
        if: steps.changes.outputs.run_tests == 'false'
        run: echo "Only documentation, website, or artwork changed; Rust checks are not needed."
      - name: Install native build tools
        if: steps.changes.outputs.run_tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake lld perl pkg-config
      - name: Install Rust
        if: steps.changes.outputs.run_tests == 'true'
        # rustup installs the toolchain and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Restore Cargo downloads
        if: steps.changes.outputs.run_tests == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiled dependencies
        if: steps.changes.outputs.run_tests == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: build-v1-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'apps/*/Cargo.toml', 'tools/*/Cargo.toml', '.cargo/config.toml', 'Makefile', '.github/workflows/ci.yml', '.github/workflows/cache.yml') }}
          restore-keys: |
            build-v1-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Format, lint, and Rust tests
        if: steps.changes.outputs.run_tests == 'true'
        run: make verify
