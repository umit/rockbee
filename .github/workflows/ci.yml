name: Verify

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/assets/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake perl pkg-config
      - name: Install Rust
        # rustup installs the toolchain and components from rust-toolchain.toml.
        run: rustup show active-toolchain
      - name: Cache Rust dependencies and DuckDB build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # GitHub stores Cargo downloads and dependency artifacts in target/,
          # including DuckDB's native build, keyed by Rust and dependency versions.
          key: ${{ runner.os }}-${{ runner.arch }}
          cache-provider: github
          cache-bin: "false"
      - name: Format, lint, and Rust tests
        run: make verify
