<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="An interactive design preview of Rockbee Console. Sample data only.">
  <title>Rockbee Console — Design preview</title>
  <link rel="stylesheet" href="console.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('rockbee-console-theme') || 'light'; } catch {}</script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to workspace</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Workspace navigation">
      <a class="brand" href="#data" aria-label="Rockbee Console home" data-view="data">
        <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
          <g fill="#ffb51f" stroke="#f6f7f4" stroke-width="1.5" stroke-linejoin="round"><path d="m32 2 13 8v16l-13 8-13-8V10Z"/><path d="m13 20 12 7v14l-12 7-12-7V27Z"/><path d="m51 20 12 7v14l-12 7-12-7V27Z"/><path d="m45 36 12 7v13l-12 7-12-7V43Z"/><path fill="#42535d" d="m18 36 12 7v13l-12 7-12-7V43Z"/></g>
          <path d="M29 24q-1-7-7-10m13 10q1-7 7-10" fill="none" stroke="#20282e" stroke-width="3" stroke-linecap="round"/>
          <defs><clipPath id="brand-bee"><path d="M25 25q7-5 14 0l1 8c9 12-3 22-8 29-5-7-17-17-8-29Z"/></clipPath></defs>
          <g clip-path="url(#brand-bee)"><path fill="#20282e" d="M19 20h27v44H19Z"/><path d="M19 34q13 4 27 0m-27 12q13 4 27 0m-24 9q10 4 21 0" fill="none" stroke="#ffb51f" stroke-width="4"/></g>
        </svg>
        <span>rockbee<span class="brand-caption">Console</span></span>
      </a>

      <button class="workspace-switch" id="connection-trigger" type="button" aria-label="Workspace connection settings">
        <span class="workspace-avatar">L</span>
        <span class="workspace-label"><strong id="workspace-name">Local development</strong><small>Preview workspace</small></span>
        <span data-icon="chevron" class="switch-chevron"></span>
      </button>

      <div class="nav-section-label">DATA</div>
      <nav class="main-nav" aria-label="Console">
        <button class="nav-item active" data-view="kv" type="button"><span data-icon="key"></span><span>Key-value</span><span class="nav-end nav-type">KV</span></button>
        <button class="nav-item" data-view="data" type="button"><span data-icon="data"></span><span>Tables</span><span class="nav-end nav-type">JSON</span></button>
      </nav>
      <div id="tables-navigation" class="sidebar-table-group" hidden>
        <div class="nav-section-label pinned-label"><span>PINNED TABLES</span><span class="tiny-caption">3</span></div>
        <nav id="table-list" class="table-list" aria-label="Pinned sample tables"></nav>
      </div>
      <div class="sidebar-divider"></div>
      <div class="nav-section-label">WORKSPACE</div>
      <nav class="tools-nav" aria-label="Workspace tools">
        <button class="nav-item" data-view="services" type="button"><span data-icon="services"></span><span>Services</span></button>
        <button class="nav-item" data-view="history" type="button"><span data-icon="history"></span><span>Query history</span></button>
      </nav>

      <div class="sidebar-bottom">
        <a class="nav-item" href="https://github.com/umit/rockbee#readme" target="_blank" rel="noopener noreferrer"><span data-icon="file"></span><span>Documentation</span><span data-icon="arrowUpRight" class="nav-end"></span></a>
        <button class="nav-item" id="theme-toggle" type="button" aria-label="Switch color theme"><span data-icon="sun"></span><span>Appearance</span><span class="theme-indicator">◐</span></button>
        <div class="sidebar-signature"><span class="status-dot"></span><span>Your data. Your workspace.</span></div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumbs"><button id="sidebar-toggle" class="button quiet icon-button mobile-menu" type="button" aria-label="Toggle navigation"><span data-icon="data"></span></button><span class="breadcrumb-root">Local workspace</span><span class="breadcrumb-slash">/</span><span id="breadcrumb">Key-value</span></div>
        <div class="topbar-actions"><button class="command-search" id="command-trigger" type="button"><span data-icon="search"></span><span>Find a workspace…</span><kbd>⌘ K</kbd></button><span class="user-avatar" aria-label="Local workspace">U</span></div>
      </header>

      <div class="preview-strip"><div><span class="preview-tag">PREVIEW</span><span>Sample data. Changes stay in this browser.</span></div><button id="preview-reset" type="button">Reset demo <span data-icon="refresh"></span></button></div>
      <div class="content-layout">
        <main id="main-content" class="main-content" tabindex="-1"><div class="loading-state"><span class="loading-mark"></span>Preparing your workspace…</div></main>
        <aside id="inspector" class="inspector" aria-label="Document inspector" hidden></aside>
      </div>
      <footer class="workspace-statusbar"><div><span class="status-dot blue"></span><span>Local design preview</span><span class="statusbar-divider"></span><span>No database connected</span></div><span>Rockbee Console <span class="statusbar-divider"></span> Design 03</span></footer>
    </div>
  </div>
  <dialog id="dialog" aria-label="Console dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script>
    const iconPaths = {
      data:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 9v12"/>',
      sql:'<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-12-2 14"/>',
      key:'<circle cx="8" cy="9" r="5"/><path d="m12 13 8 8m-5-5 3-3m0 6 3-3"/>',
      services:'<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/>',
      history:'<path d="M3 11a9 9 0 1 1 2 7M3 4v7h7m2-5v6l4 2"/>',
      search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
      plus:'<path d="M12 5v14M5 12h14"/>',
      chevron:'<path d="m8 9 4-4 4 4m-8 6 4 4 4-4"/>',
      arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',
      more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
      copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
      close:'<path d="m6 6 12 12M6 18 18 6"/>',
      run:'<path d="m8 5 11 7-11 7Z"/>',
      refresh:'<path d="M20 7a8 8 0 0 0-14-2L3 8m0-5v5h5m-4 9a8 8 0 0 0 14 2l3-3m0 5v-5h-5"/>',
      download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      filter:'<path d="M4 6h16M7 12h10m-7 6h4"/>',
      arrowUpRight:'<path d="M6 18 18 6M6 6h12v12"/>',
      sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
      moon:'<path d="M20 14A8 8 0 0 1 10 4a8.5 8.5 0 1 0 10 10Z"/>',
      command:'<path d="M8 8h8v8H8zM8 8H5a3 3 0 1 1 3-3Zm8 0V5a3 3 0 1 1 3 3Zm0 8h3a3 3 0 1 1-3 3Zm-8 0v3a3 3 0 1 1-3-3Z"/>',
      settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/>',
      file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 13h8m-8 4h5"/>',
      trash:'<path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/>',
      edit:'<path d="m14 5 5 5M4 20l5-1L20 8a3.5 3.5 0 0 0-5-5L4 14Z"/>',
      info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>'
    };
    window.rockbeeIcons = Object.fromEntries(Object.entries(iconPaths).map(([name, paths]) => [name, `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`]));
    document.querySelectorAll('[data-icon]').forEach(node => { node.innerHTML = window.rockbeeIcons[node.dataset.icon] || ''; });
  </script>
  <script src="console.js" defer></script>
</body>
</html>
