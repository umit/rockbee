[package]
name = "rockbee-cdc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rockbee SlateDB WAL change-data capture tool"

[lints]
workspace = true

[dependencies]
rockbee-protocol = { path = "../../crates/rockbee-protocol" }
rockbee-runtime = { path = "../../crates/rockbee-runtime" }
slatedb = { version = "=0.17.0", features = ["aws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
tempfile = { version = "3", default-features = false }
